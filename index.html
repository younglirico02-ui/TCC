<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC Fácil</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1d4ed8">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
.app{max-width:720px;margin:auto;padding:16px}h1{color:#1d4ed8;margin:0 0 4px}.sub{color:#475569;margin:0 0 16px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:700;margin-top:12px}button.g{background:#16a34a}button.s{background:#64748b;font-size:14px}button:disabled{opacity:.6}
h3{margin:0 0 8px;font-size:15px}#out{display:none}.hint{font-size:13px;color:#475569}
#print{display:none}
@media print{body{background:#fff}.app{display:none}#print{display:block;font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5;color:#000}
@page{size:A4;margin:3cm 2cm 2cm 3cm}.cover{text-align:center;page-break-after:always;min-height:24cm;display:flex;flex-direction:column;justify-content:space-between}
.pg{page-break-after:always}#print h2{font-size:13pt;text-transform:uppercase;margin:0 0 12pt}#print p{text-align:justify;text-indent:1.25cm;margin:0 0 6pt}
.sec{page-break-before:always}.sec:first-of-type{page-break-before:auto}.t{font-size:16pt;font-weight:bold;text-transform:uppercase}}
</style></head><body><div class="app">
<h1>TCC Fácil</h1><p class="sub">Escreve o tema e gera o trabalho em PDF.</p>
<div class="card"><label>Tema do trabalho *</label><input id="tema" placeholder="Ex.: A importância da educação financeira">
<label>Curso / Classe</label><input id="curso" placeholder="Ex.: 12.ª Classe, Informática">
<label>Escola / Instituição</label><input id="esc"><label>Nome do aluno</label><input id="alu"><label>Professor / Orientador</label><input id="prof">
<label>Cidade</label><input id="cid"><label>Ano</label><input id="ano" type="number">
<label>Extensão</label><select id="ext" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit"><option value="2 parágrafos">Curta</option><option value="3 a 4 parágrafos" selected>Média</option><option value="5 a 6 parágrafos">Longa</option></select>
<label>Chave da API Anthropic (para escrever com IA)</label><input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
<p class="hint">A chave fica guardada só neste telemóvel. Cria-a em console.anthropic.com.</p>
<button id="bai" onclick="genAI()">Gerar com IA</button><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ws" checked style="width:auto"> Pesquisar na web e usar fontes reais</label>
<button class="s" onclick="buscar()">Só pesquisar o tema</button><button class="s" onclick="gen()">Gerar modelo sem IA (offline)</button><p id="st" class="hint"></p></div>
<div id="res" class="card" style="display:none"></div>
<div id="out"><p class="hint">Revê e edita cada parte. Acrescenta dados reais e as tuas fontes antes de gerar o PDF.</p><div id="ed"></div>
<button class="g" onclick="pdf()">Gerar PDF</button><p class="hint">Na janela que abrir, escolhe “Guardar como PDF”.</p></div></div>
<div id="print"></div>
<script>
const $=i=>document.getElementById(i);let S=[];$('ano').value=new Date().getFullYear();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function gen(){const t=$('tema').value.trim();if(!t){alert('Escreve o tema do trabalho.');return}
const c=$('curso').value.trim()||'a área de estudo';
S=[
['Introdução',`O presente trabalho tem como tema "${t}", inserido no âmbito de ${c}. Trata-se de um assunto de grande relevância académica e social, que merece ser estudado com rigor.\n\nAo longo do trabalho procura-se compreender os principais conceitos, a evolução, a importância e os desafios ligados a "${t}", oferecendo ao leitor uma visão clara e organizada.\n\nO trabalho está estruturado em objetivos, justificativa, conceitos fundamentais, origem e evolução, importância, vantagens e desafios, metodologia e conclusão, seguidos das referências bibliográficas.`],
['Objetivos',`Objetivo geral\nAnalisar o tema "${t}", destacando os seus principais aspetos e a sua relevância em ${c}.\n\nObjetivos específicos\n- Definir os conceitos fundamentais relacionados com "${t}";\n- Descrever a origem e a evolução do tema;\n- Identificar a importância de "${t}" para a sociedade;\n- Apontar vantagens, dificuldades e possíveis soluções.`],
['Justificativa',`A escolha do tema "${t}" deve-se à sua actualidade e à necessidade de aprofundar o conhecimento sobre o assunto. Estudá-lo permite compreender melhor a realidade e contribuir para a formação académica e pessoal do autor.\n\nEspera-se que este trabalho sirva de apoio a estudantes e interessados que pretendam conhecer o tema.`],
['Conceitos Fundamentais',`Para compreender "${t}", é necessário começar pela sua definição. [Escreve aqui a definição de "${t}" segundo autores e dicionários, citando a fonte.]\n\nOs principais conceitos associados ao tema são: [conceito 1], [conceito 2] e [conceito 3]. Cada um deles contribui para a compreensão global do assunto.`],
['Origem e Evolução',`O tema "${t}" tem uma origem e um percurso próprios ao longo do tempo. [Descreve aqui quando e como surgiu, e as principais fases da sua evolução.]\n\nCom o passar dos anos, o tema sofreu mudanças influenciadas por factores sociais, económicos e tecnológicos, que moldaram a forma como é entendido hoje.`],
['Importância',`"${t}" assume grande importância porque influencia directamente a vida das pessoas e o desenvolvimento da sociedade. [Explica a importância no plano social, económico, educativo ou outro que se aplique.]\n\nNa área de ${c}, o tema contribui para melhorar práticas, decisões e resultados.`],
['Vantagens e Desafios',`Vantagens\n- [vantagem 1];\n- [vantagem 2];\n- [vantagem 3].\n\nDesafios\n- [dificuldade 1];\n- [dificuldade 2].\n\nApesar dos desafios, é possível encontrar soluções através de planeamento, informação e participação de todos os envolvidos.`],
['Metodologia',`Para a realização deste trabalho recorreu-se à pesquisa bibliográfica, com consulta de livros, artigos e fontes da internet sobre "${t}". [Se fizeste inquéritos ou entrevistas, descreve-os aqui.]\n\nOs dados recolhidos foram analisados e organizados de forma a responder aos objetivos propostos.`],
['Conclusão',`Concluído o estudo sobre "${t}", verifica-se que o tema é relevante e merece atenção. Os objetivos propostos foram alcançados, tendo-se compreendido os conceitos, a evolução, a importância e os desafios associados.\n\nRecomenda-se o aprofundamento do assunto e a sua divulgação, para que mais pessoas possam beneficiar deste conhecimento.`],
['Referências Bibliográficas',`SOBRENOME, Nome. Título da obra. Cidade: Editora, Ano.\n\nSOBRENOME, Nome. Título do artigo. Nome do site, Ano. Disponível em: endereço. Acesso em: data.`]];
render()}
function render(){$('ed').innerHTML='';S.forEach((s,i)=>{const d=document.createElement('div');d.className='card';const h=document.createElement('h3');h.textContent=(i+1)+'. '+s[0];const ta=document.createElement('textarea');ta.rows=9;ta.value=s[1];ta.oninput=()=>S[i][1]=ta.value;d.append(h,ta);$('ed').append(d)});
$('out').style.display='block';$('out').scrollIntoView()}
try{$('key').value=localStorage.getItem('k')||''}catch(e){}
const T=[['Introdução','apresentar o tema, contextualizá-lo, indicar a importância e explicar como o trabalho está organizado'],['Objetivos','começar com a linha "Objetivo geral" seguida de uma frase, depois a linha "Objetivos específicos" seguida de 4 itens, cada um numa linha começada por "- "'],['Justificativa','explicar porque o tema foi escolhido e a sua relevância social e académica'],['Conceitos Fundamentais','definir o tema e os conceitos principais associados'],['Origem e Evolução','descrever como o tema surgiu e evoluiu, em termos gerais, sem datas ou factos de que não tenhas certeza'],['Importância','explicar a importância do tema para a sociedade e para a área de estudo'],['Vantagens e Desafios','"Vantagens" e "Desafios" como duas partes, cada uma com itens em linhas começadas por "- ", e uma frase final'],['Metodologia','descrever uma pesquisa bibliográfica; não inventes inquéritos, entrevistas nem dados'],['Conclusão','retomar os objetivos, resumir as ideias principais e dar uma recomendação final'],['Referências Bibliográficas','']];
const SYS='És um assistente que ajuda estudantes a escrever trabalhos escolares (TCC) em português. Usa texto corrido, linguagem formal e clara adequada ao nível do aluno, sem markdown (sem #, ** ou tabelas). Nunca inventes citações, estatísticas, autores ou obras; se não tens certeza de um dado concreto, escreve em termos gerais. Responde apenas com o texto da secção, sem título.';
const M='claude-haiku-5-5';let R=null;
async function call(b,k){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(b)});
if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(r.status==401?'Chave inválida.':(e.error&&e.error.message)||('Erro '+r.status))}
return r.json()}
const tx=d=>d.content.filter(b=>b.type=='text').map(b=>b.text).join('').trim();
const ask=async(u,k)=>tx(await call({model:M,max_tokens:1500,system:SYS,messages:[{role:'user',content:u}]},k));
async function pesq(t,k){const d=await call({model:M,max_tokens:2000,tools:[{type:'web_search_20250305',name:'web_search',max_uses:5}],system:'Pesquisa na web e responde em português.',messages:[{role:'user',content:`Pesquisa na web sobre o tema "${t}" para um trabalho escolar. Escreve notas factuais organizadas (definição, origem e história, importância, vantagens e desafios, dados relevantes), até 600 palavras, sem markdown.`}]},k);
const f=[],seen={};const add=(u,n)=>{if(u&&!seen[u]&&f.length<8){seen[u]=1;f.push({url:u,title:(n||u).trim()})}};
d.content.forEach(b=>{if(b.type=='text')(b.citations||[]).forEach(c=>add(c.url,c.title));else if(b.type=='web_search_tool_result'&&Array.isArray(b.content))b.content.forEach(x=>add(x.url,x.title))});
return {notas:tx(d),fontes:f,t}}
function showRes(r){const o=$('res');o.innerHTML='';o.style.display='block';const h=document.createElement('h3');h.textContent='Resultado da pesquisa';const p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.textContent=r.notas;o.append(h,p);
if(r.fontes.length){const h2=document.createElement('h3');h2.textContent='Fontes';o.append(h2);r.fontes.forEach(f=>{const a=document.createElement('a');a.href=f.url;a.target='_blank';a.rel='noopener';a.textContent=f.title;a.style.cssText='display:block;margin:4px 0;word-break:break-word';o.append(a)})}}
function dados(){const t=$('tema').value.trim(),k=$('key').value.trim();if(!t){alert('Escreve o tema do trabalho.');return null}if(!k){alert('Cola a tua chave da API.');return null}try{localStorage.setItem('k',k)}catch(e){}return{t,k}}
async function buscar(){const d=dados();if(!d)return;$('st').textContent='A pesquisar na web...';
try{R=await pesq(d.t,d.k);showRes(R);$('st').textContent=R.fontes.length?'Encontrei '+R.fontes.length+' fontes.':'Não encontrei fontes.';$('res').scrollIntoView()}catch(e){$('st').textContent='Erro: '+e.message}}
async function genAI(){const d=dados();if(!d)return;const{t,k}=d;
const c=$('curso').value.trim()||'não indicado',L=$('ext').value,b=$('bai');b.disabled=true;S=[];let aviso='';
try{if($('ws').checked&&!(R&&R.t===t)){$('st').textContent='A pesquisar na web...';try{R=await pesq(t,k);showRes(R)}catch(e){R=null;aviso=' (sem pesquisa: '+e.message+')'}}
const U=$('ws').checked&&R&&R.t===t?R:null;
for(let i=0;i<T.length;i++){const [n,g]=T[i];$('st').textContent='A escrever '+(i+1)+'/'+T.length+': '+n+'...';
if(!g){if(U&&U.fontes.length){const dt=new Date().toLocaleDateString('pt-PT');S.push([n,U.fontes.map(f=>`${f.title}. Disponível em: ${f.url}. Acesso em: ${dt}.`).join('\n\n')])}
else S.push([n,await ask(`Tema do trabalho: ${t}\nCurso/classe: ${c}\nEscreve 3 a 5 referências bibliográficas no formato ABNT apenas se tiveres plena certeza de que existem; caso contrário, dá só o modelo "SOBRENOME, Nome. Título. Cidade: Editora, Ano." para o aluno preencher. Termina com a linha: "Confirma todas as referências antes de entregar."`,k)]);continue}
S.push([n,await ask(`Tema do trabalho: ${t}\nCurso/classe: ${c}\nSecção a escrever: ${n}\nO que incluir: ${g}\nExtensão: cerca de ${L}.\nEstrutura do trabalho: ${T.map(x=>x[0]).join(', ')}.${U?'\n\nNotas de pesquisa (baseia-te nelas; não acrescentes factos que não estejam nelas nem que não conheças com certeza):\n'+U.notas:''}`,k)])}
$('st').textContent='Pronto. Revê o texto antes de gerar o PDF.'+aviso;render()}
catch(e){$('st').textContent='Erro: '+e.message;if(S.length)render()}b.disabled=false}
function pdf(){const v=i=>esc($(i).value.trim());
let h=`<div class="cover"><div><b>${v('esc')}</b><br>${v('curso')}</div><div class="t">${v('tema')}</div><div>${v('alu')?'Autor: '+v('alu'):''}<br>${v('prof')?'Professor/Orientador: '+v('prof'):''}<br><br>${v('cid')}, ${v('ano')}</div></div>`;
h+=`<div class="pg"><h2>Índice</h2>${S.map((s,i)=>`<p style="text-indent:0">${i+1}. ${esc(s[0])}</p>`).join('')}</div>`;
S.forEach((s,i)=>{h+=`<div class="sec"><h2>${i+1}. ${esc(s[0])}</h2>${esc(s[1]).split(/\n\n+/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}</div>`});
$('print').innerHTML=h;document.title=($('tema').value.trim()||'TCC').slice(0,60);setTimeout(()=>window.print(),200)}
</script></body></html>
